[build]
builder = "NIXPACKS"
# NODE_ENV=production npm'in devDependencies atlamasına yol açar.
# tailwindcss build sırasında gerekli; runtime NODE_ENV production kalır.
buildCommand = "npm install --include=dev && npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"

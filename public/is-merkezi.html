<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>İş Merkezi — Araç Takip</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="tailwind-built.css">
  <link rel="stylesheet" href="styles.css?v=1.0.23-20260928-calc-row">
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
  <script src="session-manager.js?v=20260911-ismerkezi"></script>
  <script src="rp-dialog.js?v=1.0.2-20260820-pwd"></script>
  <script src="araclar-gate.js?v=1.0.3-20260929-amir"></script>
</head>
<body class="im-page">
  <main id="imPage" class="im-main">
    <div class="im-calc-row">
      <section class="im-card">
        <h2>Ton ÷ 27 (satır)</h2>
        <label class="im-field">Ton
          <input id="imTonInput" type="text" inputmode="decimal" placeholder="ör. 54">
        </label>
        <p id="imTonOut" class="im-calc-out">Ton girin</p>
      </section>

      <section class="im-card">
        <h2>BBT × birim = tonaj</h2>
        <label class="im-field">Ambalaj BBT sayısı
          <input id="imBbtCountInput" type="text" inputmode="decimal" placeholder="ör. 40">
        </label>
        <label class="im-field">Birim ağırlık (kg)
          <input id="imUnitKgInput" type="text" inputmode="decimal" placeholder="ör. 1250">
        </label>
        <p id="imTonajOut" class="im-calc-out">BBT ve birim kg girin</p>
      </section>

      <section class="im-card">
        <h2>Nakliyeciye kalan</h2>
        <p class="im-hint im-nak-lead">Excel’de <strong>sarı GPM</strong> satırlarının BBT’sini topla. Formül: <strong>toplam − bizim = nakliyeci</strong>.</p>
        <label class="im-field">1) Sipariş toplam BBT
          <input id="imNakTotalBbt" type="text" inputmode="decimal" placeholder="ör. 200">
        </label>
        <label class="im-field">2) Birim kg (ipucu için)
          <input id="imNakUnitKg" type="text" inputmode="decimal" placeholder="ör. 1350">
        </label>
        <p id="imNakCapHint" class="im-hint im-nak-tip"></p>
        <label class="im-field">3) Bizim kaç araç (isteğe bağlı — BBT’yi doldurur)
          <input id="imNakArac" type="text" inputmode="numeric" placeholder="ör. 6">
        </label>
        <label class="im-field">4) Bizim toplam BBT (sarı GPM)
          <input id="imNakBizimBbt" type="text" inputmode="decimal" placeholder="ör. 114">
        </label>
        <p id="imNakSteps" class="im-nak-steps" hidden></p>
        <p id="imNakOut" class="im-calc-out">Toplam ve bizim BBT girin</p>
      </section>
    </div>
  </main>

  <div class="toast" id="imToast"></div>

  <script src="modules/is-merkezi.js?v=1.0.13-20260928-format"></script>
  <script>
    (function () {
      try { document.documentElement.style.visibility = 'hidden'; } catch (e) { /* ignore */ }
      function toast(msg, isErr) {
        var el = document.getElementById('imToast');
        if (!el) return;
        el.textContent = msg || '';
        el.className = 'toast show' + (isErr ? ' warn' : '');
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove('show'); }, 3200);
      }
      function showPage() {
        try { document.documentElement.style.visibility = ''; } catch (e) { /* ignore */ }
      }
      function goHome() {
        if (window.SessionManager && typeof window.SessionManager.navigateToHome === 'function') {
          window.SessionManager.navigateToHome();
        } else {
          location.href = 'GIRIS.html';
        }
      }
      function openPage(path) {
        if (window.SessionManager && typeof window.SessionManager.openAppPage === 'function') {
          window.SessionManager.openAppPage(path);
        } else {
          location.href = path;
        }
      }
      async function boot() {
        if (window.SessionManager && typeof window.SessionManager.requireValidSession === 'function') {
          var ok = await window.SessionManager.requireValidSession();
          if (!ok) return;
        }
        if (!window.AraclarGate || typeof window.AraclarGate.isAmirUser !== 'function' || !window.AraclarGate.isAmirUser()) {
          if (window.SessionManager && typeof window.SessionManager.navigateToHome === 'function') window.SessionManager.navigateToHome();
          else location.href = 'GIRIS.html';
          return;
        }
        if (typeof window.AraclarGate.markUnlocked === 'function') window.AraclarGate.markUnlocked();
        if (!window.AraclarGate || typeof window.AraclarGate.isUnlocked !== 'function' || !window.AraclarGate.isUnlocked()) {
          openPage('ihracat-takip.html');
          return;
        }
        showPage();
        if (window.IsMerkezi) window.IsMerkezi.bindAppUi({ toast: toast });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>

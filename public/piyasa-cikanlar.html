<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>Piyasa Çıkanlar — Araç Takip</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="tailwind-built.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
  <script src="session-manager.js?v=20260820-piyasa-cikanlar"></script>
  <style>
    body.pc-page { background: #eef2ff; min-height: 100vh; color: #334155; }
    .pc-header { background: linear-gradient(to right, #312e81, #4f46e5); color: #fff; }
    .pc-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .pc-input, .pc-select {
      padding: 0.45rem 0.65rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.8125rem;
      background: #fff;
    }
    .pc-btn {
      border: 1px solid #cbd5e1;
      background: #fff;
      padding: 0.42rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
    }
    .pc-btn:hover { background: #f8fafc; }
    .pc-btn--primary { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .pc-btn--primary:hover { background: #4338ca; }
    .pc-btn--ok { background: #15803d; border-color: #15803d; color: #fff; }
    .pc-btn--ok:hover { background: #166534; }
    .pc-hint { font-size: 0.78rem; color: #64748b; margin: 0 0 10px; }
    .pc-table-wrap { overflow-x: auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; }
    .pc-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .pc-table th {
      text-align: left;
      background: #eef2ff;
      color: #3730a3;
      font-size: 0.68rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 8px 10px;
      border-bottom: 1px solid #c7d2fe;
      white-space: nowrap;
    }
    .pc-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: top;
    }
    .pc-table tbody tr:hover { background: #f8fafc; }
    .pc-empty { padding: 28px 16px; text-align: center; color: #64748b; font-size: 0.875rem; }
    .pc-count { font-size: 0.75rem; color: #64748b; margin-top: 8px; }
    .pc-mono { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pc-week { font-size: 0.68rem; font-weight: 700; color: #4f46e5; margin-top: 2px; line-height: 1.2; }
    .pc-date-week { font-size: 0.7rem; font-weight: 700; color: #4338ca; margin-top: 4px; }
  </style>
</head>
<body class="pc-page">
  <header class="pc-header">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4 flex-wrap">
      <div>
        <div class="text-lg font-bold">Piyasa Çıkanlar</div>
        <div class="text-xs text-indigo-100">Takip formu basılan piyasa işleri — YD / ihracat bu listede yok</div>
      </div>
      <button type="button" data-nav-home class="px-4 py-2 bg-white/15 hover:bg-white/25 border border-white/25 rounded-lg text-sm text-white">Ana Sayfa</button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-3 sm:p-4">
    <div class="pc-card">
      <p class="pc-hint">Tarih, plaka, firma ve sipariş burada birikir. Excel’e aktarın; elle tarih işlemeye gerek kalmaz.</p>
      <div class="flex flex-wrap gap-2 items-end">
        <label class="text-xs font-semibold text-slate-600">Başlangıç<br>
          <input type="date" id="pcFrom" class="pc-input">
          <div id="pcFromWeek" class="pc-date-week"></div>
        </label>
        <label class="text-xs font-semibold text-slate-600">Bitiş<br>
          <input type="date" id="pcTo" class="pc-input">
          <div id="pcToWeek" class="pc-date-week"></div>
        </label>
        <label class="text-xs font-semibold text-slate-600">Firma<br>
          <input type="search" id="pcFirma" class="pc-input" style="width:120px;" placeholder="HP7" autocomplete="off">
        </label>
        <label class="text-xs font-semibold text-slate-600">Plaka<br>
          <input type="search" id="pcPlaka" class="pc-input" style="width:130px;" placeholder="Plaka" autocomplete="off">
        </label>
        <button type="button" id="pcTodayBtn" class="pc-btn">Bugün</button>
        <button type="button" id="pcRefreshBtn" class="pc-btn pc-btn--primary"><i class="fas fa-sync-alt"></i> Yenile</button>
        <button type="button" id="pcExportBtn" class="pc-btn pc-btn--ok"><i class="fas fa-file-excel"></i> Excel’e aktar</button>
      </div>
      <div id="pcCount" class="pc-count"></div>
    </div>

    <div class="pc-table-wrap">
      <table class="pc-table">
        <thead>
          <tr>
            <th>Tarih</th>
            <th>Saat</th>
            <th>Plaka</th>
            <th>Firma</th>
            <th>Firma adı</th>
            <th>Sip no</th>
            <th>Malzeme</th>
            <th>Yükleme türü</th>
            <th>Şehir</th>
            <th>Sevk yeri</th>
            <th>Tonaj</th>
            <th>Şoför</th>
            <th>Basım</th>
          </tr>
        </thead>
        <tbody id="pcTbody">
          <tr><td colspan="13" class="pc-empty">Yükleniyor…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="piyasa-cikanlar.js?v=20260820-hafta"></script>
</body>
</html>

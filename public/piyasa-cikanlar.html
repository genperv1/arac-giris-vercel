<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="logo.png" />
  <title>Piyasa Çıkanlar — Araç Takip</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="tailwind-built.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/font-awesome/css/all.min.css">
  <script src="session-manager.js?v=20260929-amir"></script>
  <style>
    html, body.pc-page { max-width: 100%; overflow-x: hidden; }
    body.pc-page {
      background: #f3f0ea;
      min-height: 100vh;
      color: #2a2622;
      font-family: "Segoe UI", Calibri, sans-serif;
    }
    .pc-header {
      background: #1a1814;
      color: #f7f3ec;
      border-bottom: 3px solid #b8956a;
    }
    .pc-header-inner {
      width: 100%;
      padding: 16px 22px 14px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }
    .pc-kicker {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b8956a;
      font-weight: 600;
    }
    .pc-title {
      margin: 2px 0 0;
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 1.1;
    }
    .pc-sub { margin: 4px 0 0; font-size: 12px; color: #c9c2b6; }
    .pc-header-side { display: flex; align-items: center; gap: 18px; }
    .pc-amir-name {
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 1;
      color: #f7f3ec;
      white-space: nowrap;
    }
    .pc-home {
      border: 1px solid rgba(247, 243, 236, 0.28);
      background: transparent;
      color: #f7f3ec;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .pc-home:hover { background: rgba(247, 243, 236, 0.08); }
    .pc-card {
      background: #fff;
      border: 1px solid #e4dfd6;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .pc-input, .pc-select {
      padding: 0.45rem 0.65rem;
      border: 1px solid #d9d3c8;
      border-radius: 2px;
      font-size: 0.8125rem;
      background: #fff;
      color: #2a2622;
    }
    .pc-input:focus { outline: 1px solid #b8956a; border-color: #b8956a; }
    .pc-btn {
      border: 1px solid #d9d3c8;
      background: #fff;
      padding: 0.42rem 0.8rem;
      border-radius: 2px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      color: #2a2622;
    }
    .pc-btn:hover { background: #f7f4ef; }
    .pc-btn--primary { background: #1a1814; border-color: #1a1814; color: #f7f3ec; }
    .pc-btn--primary:hover { background: #2c2823; }
    .pc-btn--ok { background: #1f3d32; border-color: #1f3d32; color: #f7f3ec; }
    .pc-btn--ok:hover { background: #275243; }
    .pc-hint { font-size: 0.78rem; color: #6f675e; margin: 0 0 10px; line-height: 1.45; }
    .pc-table-wrap {
      overflow: hidden;
      width: 100%;
      max-width: 100%;
      background: #fff;
    }
    .pc-table {
      width: 100%;
      max-width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 12px;
      font-family: Calibri, 'Segoe UI', Arial, sans-serif;
      line-height: 1.25;
    }
    .pc-table col.c-tarih { width: 7%; }
    .pc-table col.c-saat { width: 5%; }
    .pc-table col.c-plaka { width: 8.5%; }
    .pc-table col.c-firma { width: 6%; }
    .pc-table col.c-firma-adi { width: 12%; }
    .pc-table col.c-sip { width: 7%; }
    .pc-table col.c-malzeme { width: 15%; }
    .pc-table col.c-yukleme { width: 8%; }
    .pc-table col.c-sehir { width: 11%; }
    .pc-table col.c-tonaj { width: 5%; }
    .pc-table col.c-sofor { width: 9.5%; }
    .pc-table col.c-basim { width: 6%; }
    .pc-table th,
    .pc-table td {
      border: 1px solid #c5c5c5;
      padding: 4px 6px;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
      vertical-align: middle;
    }
    .pc-table th {
      text-align: left;
      background: #f6f3ee;
      color: #5e564c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .pc-table tbody tr:nth-child(even) { background: #fbfaf7; }
    .pc-table tbody tr:hover { background: #f3efe6; }
    .pc-table td.pc-firma { font-weight: 700; letter-spacing: 0.02em; }
    .pc-table td.pc-sehir { white-space: normal; line-height: 1.3; }
    .pc-table td.pc-malzeme { white-space: pre-line; line-height: 1.3; }
    .pc-empty { padding: 28px 16px; text-align: center; color: #64748b; font-size: 0.875rem; }
    .pc-count { font-size: 0.75rem; color: #64748b; margin-top: 8px; }
    .pc-mono { font-variant-numeric: tabular-nums; }
    .pc-week { font-size: 10px; font-weight: 700; color: #8a7049; margin-top: 1px; line-height: 1.2; }
    .pc-weeks { display: flex; flex-direction: column; gap: 10px; }
    .pc-acc { background: #fff; border: 1px solid #e4dfd6; overflow: hidden; }
    .pc-acc--current { border-color: #d7c4a4; border-top: 2px solid #b8956a; }
    .pc-acc--past { background: #f7f4ef; }
    .pc-acc > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      user-select: none;
    }
    .pc-acc > summary::-webkit-details-marker { display: none; }
    .pc-acc > summary::before {
      content: '▸';
      color: #8a7049;
      font-size: 0.85rem;
      width: 1rem;
      flex-shrink: 0;
      line-height: 1;
    }
    .pc-acc[open] > summary::before { content: '▾'; }
    .pc-acc > summary:hover { background: #f7f4ef; }
    .pc-acc--current > summary { background: #fbf8f3; }
    .pc-acc--current > summary:hover { background: #f3efe6; }
    .pc-acc-title { font-weight: 600; color: #1a1814; font-size: 0.92rem; }
    .pc-acc-sub { font-size: 0.75rem; color: #6f675e; }
    .pc-acc-count {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 600;
      color: #5e564c;
      background: #f3efe6;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .pc-acc--past > summary .pc-acc-title { color: #3f3a34; }
    .pc-acc-body { border-top: 1px solid #e4dfd6; overflow: hidden; }
    .pc-acc-body .pc-table-wrap { overflow: hidden; border: 0; border-radius: 0; }
    .pc-acc--past .pc-acc { margin: 8px 10px 10px; }
    .pc-acc--nested { background: #fff; }
  </style>
</head>
<body class="pc-page">
  <header class="pc-header">
    <div class="pc-header-inner">
      <div>
        <div class="pc-kicker">Piyasa</div>
        <h1 class="pc-title">Çıkanlar</h1>
        <p class="pc-sub">Basılan piyasa işleri. YD ve GYD ihracattır, bu listede yoktur.</p>
      </div>
      <div class="pc-header-side">
        <div class="pc-amir-name">Şaban Lahaçlar</div>
        <button type="button" data-nav-home class="pc-home">Ana Sayfa</button>
      </div>
    </div>
  </header>

  <main class="w-full max-w-none px-3 pb-4 pt-3">
    <div class="pc-card">
      <p class="pc-hint">Firma kısa kodla görünür: K1BGSP → K1, G9SP → G9, CR2S → CR2. HP7 ve HP13 olduğu gibi kalır; yer adı kesilmez. Bu hafta açık durur, eski haftalar “Geçmiş kayıtlar” içindedir.</p>
      <div class="flex flex-wrap gap-2 items-end">
        <label class="text-xs font-semibold text-slate-600">Firma<br>
          <input type="search" id="pcFirma" class="pc-input" style="width:120px;" placeholder="HP7" autocomplete="off">
        </label>
        <label class="text-xs font-semibold text-slate-600">İl / Şehir<br>
          <input type="search" id="pcIl" class="pc-input" style="width:150px;" placeholder="Ankara" autocomplete="off">
        </label>
        <label class="text-xs font-semibold text-slate-600">Plaka<br>
          <input type="search" id="pcPlaka" class="pc-input" style="width:130px;" placeholder="Plaka" autocomplete="off">
        </label>
        <button type="button" id="pcRefreshBtn" class="pc-btn pc-btn--primary"><i class="fas fa-sync-alt"></i> Yenile</button>
        <button type="button" id="pcExportBtn" class="pc-btn pc-btn--ok"><i class="fas fa-file-excel"></i> Excel’e aktar</button>
      </div>
      <div id="pcCount" class="pc-count"></div>
    </div>

    <div id="pcWeeks" class="pc-weeks">
      <div class="pc-empty" style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;">Yükleniyor…</div>
    </div>
  </main>

  <script src="piyasa-cikanlar.js?v=20260930-firma"></script>
</body>
</html>

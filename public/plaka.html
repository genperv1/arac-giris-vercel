<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="logo.png" />
  <meta name="theme-color" content="#111111" />
  <title>Plaka Ayırma — Yönetim Paneli</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="core-dom.js"></script>
  <script src="rp-dialog.js?v=20260605-fixes-v1"></script>
  <script src="session-manager.js?v=20260605-fixes-v1"></script>
  <style>
    :root {
      --ink: #111111;
      --muted: #7a756e;
      --line: #e6e1d8;
      --paper: #f4f1eb;
      --card: #fffcf7;
      --red: #c81e1e;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
      --sans: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
    }

    body.pl-page {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }

    .pl-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }

    .pl-brand {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 650;
      color: var(--ink);
    }

    .pl-home {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      padding: 0;
    }

    .pl-home:hover { color: var(--ink); }

    .pl-wrap {
      width: min(1360px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 64px;
    }

    .pl-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .pl-title {
      margin: 0;
      font-size: 34px;
      font-weight: 560;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .pl-metrics {
      display: flex;
      gap: 28px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pl-metric b {
      display: block;
      margin-top: 4px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      text-transform: none;
    }

    .pl-note {
      display: none;
      margin: 0 0 22px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: var(--red);
      font-size: 13px;
    }

    .pl-note.show { display: block; }

    .pl-note strong {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .pl-note ul {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      font-family: var(--mono);
      font-size: 12px;
      columns: 2;
      column-gap: 28px;
    }

    .pl-grid {
      display: grid;
      grid-template-columns: minmax(260px, 0.7fr) minmax(520px, 1.3fr);
      gap: 22px;
    }

    .pl-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .pl-card-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pl-actions {
      display: flex;
      gap: 8px;
    }

    .pl-btn {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 8px 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .pl-btn:hover { opacity: 0.88; }

    .pl-btn-ghost {
      background: transparent;
      color: var(--ink);
    }

    .pl-btn.is-busy {
      opacity: 0.55;
      pointer-events: none;
    }

    #input,
    #search {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 12px;
      outline: none;
      font-family: var(--mono);
    }

    #input {
      flex: 1;
      min-height: 320px;
      padding: 16px;
      font-size: 13px;
      line-height: 1.7;
      resize: vertical;
    }

    #search {
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    #input:focus,
    #search:focus {
      border-color: #bbb4a8;
    }

    #input::placeholder,
    #search::placeholder {
      color: #b3ada4;
    }

    .pl-copy {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .pl-copy .pl-btn {
      padding: 8px 14px;
      font-size: 13px;
    }

    .pl-copy-hint {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .pl-table-wrap {
      flex: 1;
      overflow: auto;
    }

    .pl-table {
      width: 100%;
      border-collapse: collapse;
    }

    .pl-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 6px 10px;
      border-bottom: 1px solid var(--line);
    }

    .pl-table th:first-child,
    .pl-table td:first-child { width: 42px; }

    .pl-table th:last-child,
    .pl-table td:last-child { text-align: right; }

    .pl-table td {
      padding: 14px 8px;
      border-bottom: 1px solid #efeae2;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--ink);
      vertical-align: middle;
    }

    .pl-table tbody tr {
      cursor: pointer;
    }

    .pl-table tbody tr:hover td {
      background: rgba(17, 17, 17, 0.025);
    }

    .pl-table tbody tr.selected td {
      background: rgba(17, 17, 17, 0.05);
    }

    .pl-table tbody tr.reg-row td {
      color: var(--ink);
    }

    .pl-table tbody tr.unreg-row td {
      color: var(--red);
    }

    .td-sira {
      color: var(--muted);
      font-size: 12px;
    }

    .td-plate {
      font-weight: 750;
      font-size: 28px;
      letter-spacing: 0.04em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .td-driver {
      font-family: var(--sans);
      font-weight: 750;
      font-size: 24px;
      letter-spacing: -0.03em;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .td-phone {
      font-weight: 750;
      font-size: 24px;
      letter-spacing: 0.04em;
      line-height: 1.15;
      white-space: nowrap;
    }

    .td-empty {
      font-family: var(--sans);
      font-size: 16px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0;
      text-transform: none;
    }

    .td-bbt {
      font-weight: 600;
      font-size: 18px;
    }

    mark {
      background: #efe6c8;
      color: inherit;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty-row td {
      text-align: center;
      color: var(--muted);
      padding: 48px 10px;
      font-family: var(--sans);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }

    .toast.show { opacity: 1; }

    .toast.warn { background: var(--red); }

    @media (max-width: 820px) {
      .pl-top,
      .pl-wrap { padding-left: 16px; padding-right: 16px; }

      .pl-wrap { width: 100%; padding-top: 24px; }

      .pl-head,
      .pl-grid { display: block; }

      .pl-metrics { margin-top: 18px; }

      .pl-card { min-height: 0; margin-bottom: 16px; }

      .pl-title { font-size: 28px; }

      .pl-note ul { columns: 1; }

      .td-plate { font-size: 22px; }
      .td-driver, .td-phone { font-size: 18px; }

      #input,
      #search { font-size: 16px; }
    }
  </style>
</head>
<body class="pl-page">

<header class="pl-top">
  <div class="pl-brand">Araç Takip</div>
  <button type="button" id="backBtn" class="pl-home">Ana Sayfa</button>
</header>

<main class="pl-wrap">
  <div class="pl-head">
    <h1 class="pl-title">Plaka Ayırma</h1>
    <div class="pl-metrics">
      <div>BBT<b id="totalBBT">0</b></div>
      <div>Plaka<b id="count">0</b></div>
    </div>
  </div>

  <div id="dupBanner" class="pl-note" role="alert">
    <strong>Aynı plaka birden fazla kez var</strong>
    <ul id="dupList"></ul>
  </div>

  <div class="pl-grid">
    <section class="pl-card">
      <div class="pl-card-bar">
        <div class="pl-actions">
          <button type="button" class="pl-btn" id="parseBtn" onclick="parse()">Ayır</button>
          <button type="button" class="pl-btn pl-btn-ghost" onclick="clearAll()">Temizle</button>
        </div>
      </div>
      <textarea id="input" placeholder="Plakaları veya Excel satırını buraya yapıştırın...
Örnek:
43RV120	28  ORHANİZE
03EN380	25
03ADP790 22  ORHANİZE
43ABT566 22"></textarea>
    </section>

    <section class="pl-card">
      <input type="search" id="search" placeholder="Plaka ara" autocomplete="off">
      <div class="pl-copy">
        <button type="button" class="pl-btn" onclick="copyCol('plate')">Plakalar</button>
        <button type="button" class="pl-btn" onclick="copyCol('bbt')">BBT sayıları</button>
        <button type="button" class="pl-btn" onclick="copyCol('driver')">Şoför bilgileri</button>
      </div>
      <p class="pl-copy-hint">Her düğme ayrı kopyalar. <strong>Plakalar</strong> → PLAKA sütunu · <strong>BBT</strong> → BBT sütunu · <strong>Şoför bilgileri</strong> → ŞOFÖR ADI SOYADI hücresi (telefon yanına oturur).</p>
      <div class="pl-table-wrap">
        <table class="pl-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Plaka</th>
              <th>Şoför</th>
              <th>Telefon</th>
              <th>BBT</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
<script src="modules/plaka-ayir.js?v=20260909-copy-cols"></script>
<script>
let rows = [], fuse = null, currentTotal = 0, displayedList = [], selectedIndex = -1;
let duplicatePlates = new Set();
let toastTimer = null;
let lookupDone = false;
const LOOKUP_BATCH = 80;

/** Sunucu /api/vehicles/lookup-batch ile aynı plaka anahtarı */
function normPlateKey(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '').replace(/[^a-z0-9ığüşöç]/gi, '');
}

function copyText(value, html) {
  const text = String(value == null ? '' : value);
  if (html && navigator.clipboard && window.ClipboardItem) {
    const item = new ClipboardItem({
      'text/plain': new Blob([text], { type: 'text/plain' }),
      'text/html': new Blob([html], { type: 'text/html' })
    });
    return navigator.clipboard.write([item]).catch(() => copyTextFallback(text));
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => copyTextFallback(text));
  }
  return copyTextFallback(text);
}

function copyTextFallback(text) {
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', 'readonly');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) resolve(true);
    else reject(new Error('copy failed'));
  });
}

function setParseBusy(busy) {
  const btn = document.getElementById('parseBtn');
  if (!btn) return;
  btn.classList.toggle('is-busy', !!busy);
  btn.disabled = !!busy;
  btn.textContent = busy ? 'Ayrılıyor' : 'Ayır';
}

async function lookupPlatesBatch(plates) {
  const unique = [...new Set((plates || []).map(p => normPlateKey(p)).filter(Boolean))];
  const out = {};
  for (let i = 0; i < unique.length; i += LOOKUP_BATCH) {
    const chunk = unique.slice(i, i + LOOKUP_BATCH);
    try {
      const res = await fetch('/api/vehicles/lookup-batch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ plates: chunk })
      });
      if (!res.ok) throw new Error('batch failed');
      const map = await res.json();
      Object.entries(map || {}).forEach(([k, v]) => { if (v) out[k] = v; });
      chunk.forEach(p => {
        const k = normPlateKey(p);
        if (!(k in out)) out[k] = null;
      });
    } catch (e) {
      await Promise.all(chunk.map(async (plate) => {
        const k = normPlateKey(plate);
        if (k in out) return;
        try {
          const res = await fetch('/api/vehicles/lookup?plate=' + encodeURIComponent(plate), {
            credentials: 'include'
          });
          if (!res.ok) { out[k] = null; return; }
          const v = await res.json();
          out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? v : null;
        } catch (err) {
          out[k] = null;
        }
      }));
    }
  }
  return out;
}

function applyRegistrationToRows(lookupMap) {
  rows.forEach(r => {
    const key = normPlateKey(r.plate);
    const vehicle = lookupMap[key] || null;
    r.registered = !!vehicle;
    r.vehicle = vehicle;
    const lookupDriver = vehicleDriverLabel(vehicle);
    const lookupPhone = vehiclePhone(vehicle);
    if (!r.driver && lookupDriver) r.driver = lookupDriver;
    if (!r.phone && lookupPhone) r.phone = lookupPhone;
  });
}

function countRegistrationStats() {
  let reg = 0, unreg = 0;
  rows.forEach(r => {
    if (r.registered === true) reg++;
    else if (r.registered === false) unreg++;
  });
  return { reg, unreg };
}

function buildFuse() {
  const opts = { includeScore: true, includeMatches: true, threshold: 0.3, keys: ['plate', 'driver', 'phone', 'plateNorm', 'driverNorm'] };
  fuse = new Fuse(rows.map(r => ({
    ...r,
    plateNorm: turkishNormalize(r.plate),
    driverNorm: turkishNormalize(r.driver || '')
  })), opts);
}

function findDuplicatePlates(list) {
  const counts = {};
  (list || []).forEach(r => { counts[r.plate] = (counts[r.plate] || 0) + 1; });
  return Object.keys(counts).filter(p => counts[p] > 1).sort();
}

function updateDuplicateWarning(dups) {
  duplicatePlates = new Set(dups || []);
  const banner = document.getElementById('dupBanner');
  const listEl = document.getElementById('dupList');
  if (!banner || !listEl) return;
  if (!duplicatePlates.size) {
    banner.classList.remove('show');
    listEl.innerHTML = '';
    return;
  }
  const counts = {};
  rows.forEach(r => { counts[r.plate] = (counts[r.plate] || 0) + 1; });
  listEl.innerHTML = dups.map(p =>
    `<li>${escapeHtml(p)} — ${counts[p]} kez</li>`
  ).join('');
  banner.classList.add('show');
}

async function parse() {
  if (document.getElementById('parseBtn')?.classList.contains('is-busy')) return;

  const lines = (document.getElementById('input').value || '').split(/\n+/);
  rows = [];
  let total = 0;
  lines.forEach(l => {
    const parsed = parsePastedLine(l);
    if (!parsed) return;
    rows.push(parsed);
    total += parsed.bbt;
  });

  currentTotal = total;
  lookupDone = false;
  selectedIndex = -1;

  const dups = findDuplicatePlates(rows);
  updateDuplicateWarning(dups);
  buildFuse();
  renderRows(rows);

  if (!rows.length) {
    toast('Geçerli plaka bulunamadı');
    return;
  }

  setParseBusy(true);
  try {
    const lookupMap = await lookupPlatesBatch(rows.map(r => r.plate));
    applyRegistrationToRows(lookupMap);
    lookupDone = true;
    buildFuse();
    renderRows(rows);

    const { unreg } = countRegistrationStats();
    let msg = rows.length + ' plaka ayrıldı';
    if (unreg > 0) msg += ' — ' + unreg + ' kırmızı';
    const isWarn = unreg > 0 || dups.length > 0;
    if (dups.length) msg += ' · ' + dups.length + ' tekrar';
    toast(msg, isWarn, isWarn ? 4500 : 2800);
  } catch (e) {
    toast('Plaka kontrolü başarısız — liste ayrıldı ama kayıt durumu bilinmiyor', true, 5000);
  } finally {
    setParseBusy(false);
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightPlate(text, indices) {
  if (!indices || !indices.length) return escapeHtml(text);
  let out = '', last = 0;
  for (const [s, e] of indices) {
    out += escapeHtml(text.slice(last, s));
    out += '<mark>' + escapeHtml(text.slice(s, e + 1)) + '</mark>';
    last = e + 1;
  }
  out += escapeHtml(text.slice(last));
  return out;
}

function renderRows(list) {
  const tb = document.getElementById('tbody');
  tb.innerHTML = '';
  displayedList = list || [];
  if (!displayedList.length) {
    tb.innerHTML = `<tr class="empty-row"><td colspan="5">${rows.length ? 'Sonuç bulunamadı' : 'Liste bekleniyor'}</td></tr>`;
  } else {
    displayedList.forEach((r, i) => {
      const isSel = i === selectedIndex ? 'selected' : '';
      let rowCls = '';
      if (lookupDone && r.registered === true) rowCls = 'reg-row';
      else if (lookupDone && r.registered === false) rowCls = 'unreg-row';

      const ph = r._plateHtml || escapeHtml(r.plate);
      const driverHtml = r.driver
        ? escapeHtml(r.driver)
        : '<span class="td-empty">—</span>';
      const phoneHtml = r.phone
        ? escapeHtml(formatPhoneDisplay(r.phone))
        : '<span class="td-empty">—</span>';

      tb.insertAdjacentHTML('beforeend',
        `<tr data-idx="${i}" class="${isSel} ${rowCls}">
          <td class="td-sira">${i + 1}</td>
          <td class="td-plate">${ph}</td>
          <td class="td-driver">${driverHtml}</td>
          <td class="td-phone">${phoneHtml}</td>
          <td class="td-bbt">${r.bbt || ''}</td>
        </tr>`);
    });
    tb.querySelectorAll('tr[data-idx]').forEach(tr => {
      tr.addEventListener('click', () => {
        selectedIndex = Number(tr.dataset.idx);
        updateSelection();
      });
    });
  }
  document.getElementById('totalBBT').textContent = currentTotal;
  document.getElementById('count').textContent = rows.length;
}

function updateSelection() {
  document.querySelectorAll('#tbody tr[data-idx]').forEach(tr => {
    tr.classList.toggle('selected', Number(tr.dataset.idx) === selectedIndex);
  });
}

function copyCol(kind) {
  if (!rows.length) {
    toast('Önce listeyi ayırın', true);
    return;
  }
  const text = buildColumnCopyText(rows, kind);
  const hints = {
    plate: 'Plakalar kopyalandı — Excel’de PLAKA sütununa yapıştırın',
    bbt: 'BBT sayıları kopyalandı — Excel’de BBT sütununa yapıştırın',
    driver: 'Şoför bilgileri kopyalandı — Excel’de ŞOFÖR ADI SOYADI hücresine yapıştırın'
  };
  copyText(text)
    .then(() => toast(hints[kind] || 'Kopyalandı'))
    .catch(() => toast('Kopyalanamadı', true));
}

function copySelectedPlate() {
  if (selectedIndex < 0 || selectedIndex >= displayedList.length) return;
  const p = displayedList[selectedIndex].plate || '';
  if (!p) return;
  copyText(p).then(() => toast('Plaka kopyalandı — PLAKA sütununa yapıştırın: ' + p)).catch(() => toast('Kopyalanamadı', true));
}

function clearAll() {
  document.getElementById('input').value = '';
  document.getElementById('search').value = '';
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('totalBBT').textContent = '0';
  document.getElementById('count').textContent = '0';
  rows = []; fuse = null; currentTotal = 0; displayedList = []; selectedIndex = -1;
  duplicatePlates = new Set();
  lookupDone = false;
  updateDuplicateWarning([]);
}

function toast(msg, isWarn, duration) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('warn', !!isWarn);
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show', 'warn');
    toastTimer = null;
  }, duration || (isWarn ? 5000 : 2200));
}

function debounce(fn, wait) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), wait); }; }

const onSearch = debounce(() => {
  const q = document.getElementById('search').value || '';
  selectedIndex = -1;
  if (!q) { renderRows(rows); return; }
  if (!fuse) { renderRows(rows); return; }
  const results = fuse.search(turkishNormalize(q));
  const mapped = results.map(res => {
    const item = res.item || res;
    const match = (res.matches && res.matches.find(m => m.key === 'plate')) || null;
    return {
      plate: item.plate,
      bbt: item.bbt,
      registered: item.registered,
      vehicle: item.vehicle,
      driver: item.driver,
      phone: item.phone,
      excelFromPlaka: item.excelFromPlaka,
      _plateHtml: highlightPlate(item.plate, match ? match.indices : [])
    };
  });
  renderRows(mapped);
}, 220);

document.getElementById('search').addEventListener('input', onSearch);
document.getElementById('search').addEventListener('keydown', ev => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); if (displayedList.length) { selectedIndex = Math.min(displayedList.length - 1, selectedIndex + 1); updateSelection(); } }
  if (ev.key === 'ArrowUp') { ev.preventDefault(); if (displayedList.length) { selectedIndex = Math.max(0, selectedIndex - 1); updateSelection(); } }
  if (ev.key === 'Enter') { ev.preventDefault(); copySelectedPlate(); }
});

document.getElementById('backBtn')?.addEventListener('click', function () {
  try {
    if (window.SessionManager && typeof window.SessionManager.navigateToHome === 'function') {
      window.SessionManager.navigateToHome();
    } else {
      location.href = 'GIRIS.html';
    }
  } catch (e) {
    location.href = 'GIRIS.html';
  }
});

document.addEventListener('DOMContentLoaded', async () => {
  renderRows([]);
  try {
    if (window.SessionManager && typeof window.SessionManager.requireValidSession === 'function') {
      const ok = await window.SessionManager.requireValidSession();
      if (!ok) {
        if (typeof window.SessionManager.navigateToHome === 'function') {
          window.SessionManager.navigateToHome();
        } else {
          location.href = 'GIRIS.html';
        }
      }
    }
  } catch (e) { /* ignore */ }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liman — İhracat Takip Listesi</title>
  <link rel="icon" type="image/png" href="logo.png">
  <script src="session-manager.js?v=20261004-nudge4"></script>
  <style>
    body { margin: 0; background: #d9e2d4; color: #1a1a1a; font-family: Calibri, "Segoe UI", sans-serif; }
    .top { position: sticky; top: 0; z-index: 5; background: #1f4e2a; color: #fff; box-shadow: 0 1px 0 #16381e; }
    .top-inner { padding: 10px 16px 12px; }
    .top h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: .02em; }
    .ports { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
    .chip, .btn { border: 0; border-radius: 4px; padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 700; }
    .chip { background: #e8f5e9; color: #1b3a22; }
    .chip.is-on { background: #fff; color: #14532d; box-shadow: inset 0 -3px 0 #16a34a; }
    .btn { background: #166534; color: #fff; }
    .search { border: 0; border-radius: 4px; padding: 8px 10px; min-width: 160px; font: inherit; }
    .wrap { padding: 14px 12px 48px; }
    /* Bilgisayar: sayfa ortalanır; küçük sayı sütunları (çuval, palet, boş bbt/çuval ≤ 2 hane, yükleme yeri ≤ 5 karakter) dar tutulur */
    .sheet { min-width: 980px; max-width: 1360px; margin: 0 auto; }
    table.grid th.c-sira, table.grid td.c-sira { width: 30px; }
    table.grid th.c-nar, table.grid td.c-nar { width: 44px; padding-left: 2px; padding-right: 2px; }
    table.grid th.c-bbt, table.grid td.c-bbt { width: 46px; }
    table.grid th.c-ton, table.grid td.c-ton { width: 66px; }
    table.grid th.c-yer, table.grid td.c-yer { width: 60px; padding-left: 3px; padding-right: 3px; }
    table.grid th.c-durum, table.grid td.c-durum { width: 78px; }
    table.grid th.c-nar, table.grid th.c-yer { line-height: 1.1; }
    .blok { background: #fff; border: 1px solid #8fa888; box-shadow: 0 2px 6px rgba(0,0,0,.12); margin-bottom: 34px; }
    .blok:last-child { margin-bottom: 0; }
    #adminBox:empty { display: none; }
    #adminBox { margin-bottom: 14px; font-size: .85rem; }
    .known { background: #fff; border: 1px solid #cbd5e1; padding: 8px 12px; color: #334155; }
    .known + .known { margin-top: 6px; }
    .site-info.is-stale { color: #b91c1c; }
    .site-info.is-stale b { color: #b91c1c; }
    .known .site-info { display: block; margin: 2px 0; }
    .hb { font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
    .hb-ok { background: #dcfce7; color: #166534; }
    .hb-dead { background: #fee2e2; color: #991b1b; }
    .hb-none { background: #e5e7eb; color: #4b5563; font-weight: 500; }
    .liman-log summary { cursor: pointer; font-weight: 600; color: #1f2937; }
    .liman-log .log-denied { color: #b91c1c; }
    .liman-log ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; line-height: 1.5; max-height: 220px; overflow: auto; }
    .liman-log li.log-denied, .liman-log li.log-error { color: #b91c1c; }
    .liman-log li.log-changed { color: #166534; }
    .liman-log li.log-heartbeat { color: #6b7280; }
    .admin-days { display: flex; flex-direction: column; gap: 8px; }
    .close-day-row, .closed-days-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .btn-close-day { background: #b91c1c; padding: 6px 12px; font-size: .8rem; }
    .btn-close-day:disabled { opacity: .55; cursor: default; }
    .closed-label { font-weight: 700; color: #7f1d1d; }
    .closed-item { background: #fef2f2; border: 1px solid #fecaca; border-radius: 4px; padding: 3px 8px; }
    .chip-reopen { padding: 3px 9px; font-size: .74rem; background: #dcfce7; color: #14532d; }
    .blok-head { display: grid; grid-template-columns: 1.4fr .9fr; gap: 0; border-bottom: 1px solid #9ccc9c; }
    .blok-title { margin: 0; padding: 8px 10px; background: #e2efda; font-size: .92rem; line-height: 1.35; font-weight: 700; }
    .meta { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .meta th, .meta td { border: 1px solid #b7d7b0; padding: 4px 6px; text-align: left; }
    .meta th { width: 92px; background: #c6e0b4; }
    .note-line { margin: 0; padding: 4px 10px; background: #fff7ed; color: #9a3412; font-size: .8rem; font-weight: 700; }
    table.grid { width: 100%; border-collapse: collapse; font-size: .84rem; }
    table.grid th, table.grid td { border: 1px solid #b0b0b0; padding: 4px 6px; white-space: nowrap; }
    table.grid th { background: #1f4e2a; color: #fff; font-weight: 700; text-align: center; font-size: .75rem; }
    table.grid td { text-align: center; background: #fff; }
    table.grid td.left { text-align: left; }
    table.grid tr.is-out td { background: #dcfce7; }
    .noplate { color: #b45309; font-weight: 700; }
    .mark { color: #166534; font-weight: 700; font-size: .75rem; }
    .empty { padding: 28px 12px; color: #3f6212; }
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; background: #e5e7eb; border-top: 1px solid #9ca3af; padding: 4px 8px; }
    .tab { display: inline-block; background: #f3f4f6; border: 1px solid #9ca3af; border-top: 0; padding: 4px 12px; font: inherit; font-size: .8rem; font-weight: 700; color: #374151; cursor: pointer; margin-right: 2px; }
    .tab.is-on { background: #fff; color: #14532d; box-shadow: inset 0 -3px 0 #16a34a; }
    table.grid td.durum { color: #c2410c; font-weight: 700; }
    table.grid td.durum.is-out { color: #166534; }
    .progress-line { margin: 0; padding: 4px 10px; background: #f8fafc; color: #475569; font-size: .8rem; font-weight: 700; border-bottom: 1px solid #e2e8f0; }
    .done-line { margin: 0; padding: 8px 10px; background: #16a34a; color: #fff; font-size: .95rem; font-weight: 800; letter-spacing: .04em; }
    .blok.is-done .blok-title { background: #bbf7d0; }
    .blok.is-done table.grid td { background: #f0fdf4; }
    .rownote { display: block; color: #9f1239; font-size: .72rem; font-weight: 700; white-space: normal; }
    .rownote input { width: 140px; border: 1px solid #fecdd3; font: inherit; font-size: .72rem; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .presence-chip { display: inline-flex; gap: 12px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 4px 12px; font-size: .78rem; }
    .presence-item { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; opacity: .65; }
    .presence-item i { width: 8px; height: 8px; border-radius: 999px; background: #9ca3af; }
    .presence-item.is-on { opacity: 1; }
    .presence-item.is-on i { background: #4ade80; box-shadow: 0 0 0 2px rgba(74,222,128,.3); }
    .presence-item small { font-weight: 600; }
    .presence-item.is-on small { color: #bbf7d0; }
    .presence-item.is-nudge { cursor: pointer; }
    .presence-item.is-nudge:hover { background: rgba(255,255,255,.08); border-radius: 8px; }
    .presence-item.is-nudge-off { cursor: not-allowed; }
    .live { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; color: #bbf7d0; }
    .live i { width: 8px; height: 8px; border-radius: 999px; background: #4ade80; animation: live-pulse 2s ease-in-out infinite; }
    .live.is-off { color: #d1d5db; }
    .live.is-off i { background: #9ca3af; animation: none; }
    @keyframes live-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); } 50% { box-shadow: 0 0 0 5px rgba(74,222,128,0); } }
    .presence-col { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .excel-status:empty { display: none; }
    .excel-status { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: .72rem; }
    .xs-item { padding: 1px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
    .xs-ok { background: rgba(74,222,128,.18); color: #bbf7d0; }
    .xs-bad { background: #f97316; color: #fff; }
    .xs-none { background: rgba(255,255,255,.1); color: #d1d5db; }
    .toast { position: fixed; bottom: 36px; right: 16px; background: #14532d; color: #fff; padding: 10px 14px; display: none; }
    a.tel { color: inherit; text-decoration: none; }
    table.grid td.c-sum { display: none; }

    /* ===== Telefon (liman görevlisi): plaka · durum · şoför · telefon öne çıkar ===== */
    @media (max-width: 760px) {
      body { padding-bottom: 56px; }
      .top-inner { padding: 8px 10px 10px; }
      .top h1 { font-size: .95rem; }
      .title-row { gap: 6px; }
      .presence-chip, .excel-status { display: none; }
      .ports { gap: 6px; margin-top: 8px; }
      .ports #ports { display: contents; }
      .chip { padding: 7px 10px; font-size: .8rem; }
      .search { flex: 1 1 120px; min-width: 0; font-size: 16px; }
      .btn { padding: 7px 12px; }
      .wrap { padding: 10px 8px 60px; }
      .sheet { min-width: 0; }
      .blok { margin-bottom: 22px; border-radius: 8px; overflow: hidden; }
      .blok-head { grid-template-columns: 1fr; }
      .blok-title { font-size: .85rem; padding: 8px 10px; }
      .meta { font-size: .76rem; }
      .meta th { width: 84px; }
      #adminBox .known { font-size: .76rem; }

      table.grid, table.grid tbody { display: block; width: 100%; }
      table.grid thead { display: none; }
      table.grid tr {
        display: grid;
        grid-template-columns: 34px 1fr auto;
        grid-template-areas:
          "sira plaka durum"
          "sira sofor tel"
          "sira nums nums";
        align-items: center;
        gap: 2px 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #cbd5e1;
        background: #fff;
      }
      table.grid tr.is-out { background: #dcfce7; }
      table.grid td { display: block; border: 0; padding: 0; background: transparent !important; text-align: left; white-space: normal; width: auto; }
      table.grid td.c-sira { grid-area: sira; color: #64748b; font-size: .8rem; font-weight: 700; align-self: start; padding-top: 3px; }
      table.grid td.c-plaka { grid-area: plaka; font-size: 1.1rem; line-height: 1.2; }
      table.grid td.c-plaka b { letter-spacing: .03em; }
      table.grid td.c-plaka .mark { display: none; }
      table.grid td.c-durum {
        grid-area: durum; justify-self: end;
        font-size: .72rem; font-weight: 800; letter-spacing: .03em;
        padding: 3px 8px; border-radius: 999px;
        background: #ffedd5 !important; color: #c2410c;
      }
      table.grid td.c-durum.is-out { background: #16a34a !important; color: #fff; }
      table.grid td.c-durum:empty::before { content: attr(data-fallback); }
      table.grid td.c-sofor { grid-area: sofor; font-size: .92rem; color: #1e293b; }
      table.grid td.c-sofor:empty::before { content: "şoför yok"; color: #94a3b8; font-weight: 400; }
      table.grid td.c-tel { grid-area: tel; justify-self: end; }
      table.grid td.c-tel a.tel {
        display: inline-block; padding: 6px 10px; border-radius: 6px;
        background: #166534; color: #fff; font-weight: 700; font-size: .9rem; white-space: nowrap;
      }
      table.grid td.c-tel:empty { display: none; }
      table.grid td.c-min { display: none; }
      table.grid td.c-sum { grid-area: nums; display: block; font-size: .74rem; color: #475569; margin-top: 2px; }
      table.grid td.c-sum:empty { display: none; }
      table.grid td.c-sum b { color: #64748b; }
      .rownote { font-size: .78rem; }
      .rownote input { width: 100%; max-width: 220px; font-size: 16px; }
      .progress-line, .done-line { font-size: .8rem; padding: 6px 10px; }
      .tabbar { padding: 4px 6px; overflow-x: auto; white-space: nowrap; }
      .tab { font-size: .76rem; padding: 6px 10px; }
      .toast { left: 12px; right: 12px; bottom: 60px; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="title-row">
        <h1>İhracat Takip Listesi</h1>
        <div class="presence-col">
          <span class="presence-chip" id="chipPresence"></span>
          <div class="excel-status" id="excelStatus"></div>
        </div>
      </div>
      <div class="ports">
        <div id="ports"></div>
        <input id="plate" class="search" type="search" placeholder="Plaka ara" />
        <span class="live" id="liveDot" title="Liste kendiliğinden yenilenir"><i aria-hidden="true"></i><span>Canlı</span></span>
      </div>
    </div>
  </header>
  <div class="wrap">
    <div id="adminBox"></div>
    <div id="list"></div>
  </div>
  <div class="tabbar" id="sheetTabs"></div>
  <div class="toast" id="toast"></div>
  <script src="nakliye-bekleyen-core.js?v=20261003-liman3"></script>
  <script src="liman.js?v=20261004-liman24"></script>
</body>
</html>
